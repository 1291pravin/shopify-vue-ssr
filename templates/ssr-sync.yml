name: SSR sync
on:
  workflow_dispatch:
  repository_dispatch:
    types: [ssr-sync]
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 3 * * *'
permissions:
  contents: read
  issues: write
jobs:
  stores:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.stores.outputs.matrix }}
    env:
      SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Select configured stores
        id: stores
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { loadConfig } from './node_modules/shopify-vue-ssr/src/config.mjs'
          import { workflowMatrix } from './node_modules/shopify-vue-ssr/src/workflow.mjs'
          const ids = JSON.parse(execFileSync('npx', ['--no-install', 'shopify-vue-ssr', 'stores', '--json'], { encoding: 'utf8' }))
          const config = await loadConfig()
          const payload = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).client_payload ?? {}
          const matrix = workflowMatrix(config, ids, payload.store)
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`)
          NODE
  sync:
    needs: stores
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.stores.outputs.matrix) }}
    concurrency:
      group: ssr-health-${{ matrix.store.id }}
      cancel-in-progress: false
    env:
      STORE_ID: ${{ matrix.store.id }}
      STORE_CREDENTIALS: ${{ matrix.store.credentials }}
      SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      STORE_CLIENT_ID: ${{ secrets[format('SHOPIFY_CLIENT_ID_{0}', matrix.store.suffix)] }}
      STORE_CLIENT_SECRET: ${{ secrets[format('SHOPIFY_CLIENT_SECRET_{0}', matrix.store.suffix)] }}
      CREDENTIALS_CLIENT_ID: ${{ secrets[format('SHOPIFY_CLIENT_ID_{0}', matrix.store.credentials)] }}
      CREDENTIALS_CLIENT_SECRET: ${{ secrets[format('SHOPIFY_CLIENT_SECRET_{0}', matrix.store.credentials)] }}
      SHOPIFY_STOREFRONT_PASSWORD: ${{ secrets.SHOPIFY_STOREFRONT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync pages and daily cache cleanup
        id: sync
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          import { loadConfig, selectStore } from './node_modules/shopify-vue-ssr/src/config.mjs'
          import { workflowSyncArgs } from './node_modules/shopify-vue-ssr/src/workflow.mjs'
          const config = selectStore(await loadConfig(), process.env.STORE_ID)
          process.env[`SHOPIFY_CLIENT_ID_${process.env.STORE_ID.toUpperCase()}`] = process.env.STORE_CLIENT_ID || ''
          process.env[`SHOPIFY_CLIENT_SECRET_${process.env.STORE_ID.toUpperCase()}`] = process.env.STORE_CLIENT_SECRET || ''
          if (process.env.STORE_CREDENTIALS !== process.env.STORE_ID.toUpperCase()) {
            process.env[`SHOPIFY_CLIENT_ID_${process.env.STORE_CREDENTIALS}`] = process.env.CREDENTIALS_CLIENT_ID || ''
            process.env[`SHOPIFY_CLIENT_SECRET_${process.env.STORE_CREDENTIALS}`] = process.env.CREDENTIALS_CLIENT_SECRET || ''
          }
          const payload = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).client_payload ?? {}
          const args = workflowSyncArgs(config, payload.urls)
          const result = spawnSync('npx', ['--no-install', 'shopify-vue-ssr', ...args], { stdio: 'inherit' })
          if (result.status === 0 && JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).schedule === '0 3 * * *') {
            const report = JSON.parse(readFileSync(`ssr-report/${config.storeId}/report.json`, 'utf8'))
            if (report.command !== 'sync' || !report.fullCrawl || report.failures.length || report.dryRun) throw new Error('Daily cleanup requires a complete failure-free full sitemap sync')
            const cleanup = spawnSync('npx', ['--no-install', 'shopify-vue-ssr', 'prune', '--store', config.storeId, '--yes'], { stdio: 'inherit' })
            process.exit(cleanup.status ?? 1)
          }
          process.exit(result.status ?? 1)
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ssr-report-${{ matrix.store.id }}
          path: ssr-report/${{ matrix.store.id }}/
          if-no-files-found: warn
      - name: Maintain SSR health issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f "ssr-report/$STORE_ID/report.json" ]; then
            npx --no-install shopify-vue-ssr health-issue --store "$STORE_ID"
          fi
      - name: Propagate sync failure
        if: steps.sync.outcome == 'failure'
        run: exit 1
